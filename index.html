<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свечи | Уютный Магазин</title>
    <style>
        body { font-family: "Georgia", serif; background-color: #fcf8f2; color: #333; margin: 0; padding: 0; text-align: center; }
        header { background-color: #5d4037; color: white; padding: 30px 20px; }
        h1 { margin: 0; font-size: 32px; font-weight: normal; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 40px 20px; }
        .product { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; padding-bottom: 20px; overflow: hidden; }
        .product img { width: 100%; height: 200px; object-fit: cover; }
        .product h2 { font-size: 20px; margin: 15px 0 5px 0; }
        .product p { color: #666; font-size: 14px; padding: 0 15px; }
        .price { font-size: 22px; color: #d84315; font-weight: bold; margin: 15px 0; }
        button { background-color: #d84315; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #bf360c; }
    </style>
</head>
<body>
    <header>
        <h1>🕯️ Уютный Свет</h1>
        <p>Ароматические свечи ручной работы</p>
    </header>
    <div class="container">
        <div class="product">
            <img src="https://images.unsplash.com/photo-1603006905003-be475563bc59?q=80&w=400&auto=format&fit=crop" alt="Свеча Лаванда">
            <h2>Лавандовый вечер</h2>
            <p>Успокаивающий аромат для идеального отдыха.</p>
            <div class="price">1 500 ₽</div>
            <button>В корзину</button>
        </div>
        <div class="product">
            <img src="https://images.unsplash.com/photo-1574620966903-12344191e23c?q=80&w=400&auto=format&fit=crop" alt="Свеча Ваниль">
            <h2>Теплая ваниль</h2>
            <p>Сладкий и согревающий аромат для дома.</p>
            <div class="price">1 200 ₽</div>
            <button>В корзину</button>
        </div>
        <div class="product">
            <img src="https://cdn.jsdelivr.net/gh/ganvalgan1990-maker/images-@main/IMG_20261102_112820.jpg" alt="Свеча Тюльпаны">
            <h2>Весенние тюльпаны</h2>
            <p>Нежный подарок ручной работы.</p>
            <div class="price">1 500 ₽</div>
            <button>В корзину</button>
        </div>
    </div>
    <script src="script.js"></script>
<footer style="margin-top: 50px; padding: 20px; text-align: center; background-color: #5d4037; color: white;">
    <p>Свяжитесь с нами для заказа:</p>
    <a href="https://t.me/"GritNailBot" style="color: #d84315; font-weight: bold; text-decoration: none; font-size: 18px;">Написать в Telegram</a>
</footer></body>
</html>
