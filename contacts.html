<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | GritNail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" style="color: white; text-decoration: none; font-size: 16px;">← Назад</a>
        <h1>Контакты</h1>
    </header>
    
    <div class="contact-container">
        <!-- Карточка с адресом и фото -->
        <div class="contact-card">
            <!-- Картинка салона. Пока стоит заглушка, позже замените на ваше фото -->
            <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?q=80&w=600&auto=format&fit=crop" alt="Салон GritNail">
            
            <div class="contact-info">
                <h2>Наш адрес</h2>
                <p>г. Новороссийск, ул. Видова 41 Г</p>
                
                <!-- Кнопка перехода на карту -->
                <a href="https://yandex.ru/maps/?text=Новороссийск,%20улица%20Видова%2041Г" target="_blank" class="map-btn">
                    📍 Посмотреть на карте
                </a>
            </div>
        </div>

        <!-- Блок со связью -->
        <div class="contact-links">
            <h2>Связаться с нами</h2>
            
            <a href="tel:+79000000000" class="contact-item">
                <span class="icon">📞</span>
                <span>+7 (900) 000-00-00</span>
            </a>

            <a href="https://instagram.com/ваш_ник" target="_blank" class="contact-item">
                <span class="icon">📸</span>
                <span>Мы в Instagram</span>
            </a>
        </div>
    </div>

    <a href="https://t.me/GritNailBot" class="floating-btn">
        Онлайн-<br>запись
    </a>

</body>
</html>
